name: Publicar FERRO 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Instalar PlayCanvas exato no repositório
      run: npm install --no-audit --no-fund
    - name: Empacotar jogo com motor próprio
      run: |
        mkdir -p dist/src dist/vendor dist/models
        cp index.html dist/index.html
        cp .nojekyll dist/.nojekyll
        cp -R src/. dist/src/
        cp node_modules/playcanvas/build/playcanvas.mjs dist/vendor/playcanvas.mjs
        curl --retry 3 -L --fail 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb' -o dist/models/CesiumMan.glb || echo 'Modelo humano local não disponível.'
        curl --retry 3 -L --fail 'https://cdn.3dassets.dev/assets/27732/v1/model.glb' -o dist/models/cnc.glb || echo 'Máquina CNC local não disponível.'
        curl --retry 3 -L --fail 'https://cdn.3dassets.dev/assets/27724/v1/model.glb' -o dist/models/lathe.glb || echo 'Torno local não disponível.'
        curl --retry 3 -L --fail 'https://cdn.3dassets.dev/assets/27790/v1/model.glb' -o dist/models/hall.glb || echo 'Galpão local não disponível.'
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Publicar no GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
